<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Tchik</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />

    <script>
      (function () {
        const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const bgColor = isDark ? '#181c1e' : '#ffffff';
        document.documentElement.style.backgroundColor = bgColor;
      })();
    </script>

    <style>
      /* RESET BASIQUE */
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-color, #ffffff);
      }

      :root {
        --bg-color: #ffffff; /* oklch(1 0 0) */
        --text-color: #1c2124; /* oklch(0.12 0.008 200) */
        --border-color: #e5e8eb; /* oklch(0.915 0.005 195) */
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #181c1e; /* oklch(0.13 0.012 200) */
          --text-color: #f4f5f6; /* oklch(0.98 0.004 195) */
          --border-color: #383f43; /* oklch(0.24 0.01 195) */
        }
      }

      /* SPLASH SCREEN CONTAINER */
      #splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--bg-color);
        font-family: system-ui, -apple-system, sans-serif;
        z-index: 9999;
        transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.4s;
        opacity: 1;
        visibility: visible;
        will-change: opacity;
      }

      #splash-screen.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      /* LOGO & TYPOGRAPHIE */
      .brand-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 2rem;
        animation: fade-in-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .brand-logo {
        width: 80px;
        height: auto;
        margin-bottom: 1.5rem;
      }

      .brand-name {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: var(--text-color);
        margin: 0;
      }

      /* SPINNER */
      .spinner {
        width: 28px;
        height: 28px;
        border: 2.5px solid var(--border-color);
        border-top-color: var(--text-color);
        border-radius: 50%;
        animation: spin 0.8s linear infinite, fade-in 0.4s ease-out 0.2s forwards;
        opacity: 0;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes fade-in {
        to { opacity: 1; }
      }
      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    
    <div id="splash-screen">
      <div class="brand-container">
        <img class="brand-logo" src="assets/icon.svg" alt="Logo de Tchik">
        <h1 class="brand-name">Tchik</h1>
      </div>
      <div class="spinner"></div>
    </div>

    <script type="module" src="main.tsx"></script>
  </body>
</html>
