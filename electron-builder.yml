productName: Tchik
appId: com.bienfaitshm.tchik

directories:
  buildResources: build
  output: release/${version}

files:
  - "out/**/*"
  - "node_modules/**/*"
  - "!**/.vscode/**"
  - "!src/**"
  - "!electron.vite.config.*"
  - "!.eslint*"
  - "!.prettier*"
  - "!dev-app-update.yml"
  - "!CHANGELOG.md"
  - "!README.md"
  - "!.env*"
  - "!.npmrc"
  - "!pnpm-lock.yaml"
  - "!tsconfig*.json"

extraResources:
  - from: "documents_templates"
    to: "documents_templates"
  - from: "drizzle"
    to: "drizzle"

asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/sqlite3/**/*"
  - "**/node_modules/@libsql/**/*"
  - "**/*.node"

# ----------------------------------------------------
# CONFIGURATION WINDOWS
# ----------------------------------------------------
win:
  executableName: Tchik
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

# Format NSIS (Compatible Auto-Update)
nsis:
  oneClick: false
  perMachine: false                      # Permet la mise à jour sans demande UAC systématique
  allowElevation: true
  allowToChangeInstallationDirectory: true
  displayLanguageSelector: false
  shortcutName: Tchik
  createDesktopShortcut: always
  createStartMenuShortcut: true
  differentialPackage: true             # Télécharge uniquement les deltas de mise à jour

# ----------------------------------------------------
# CONFIGURATION MAC
# ----------------------------------------------------
mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  target:
    - target: dmg
      arch: [x64, arm64]
  notarize: false

dmg:
  artifactName: ${productName}_Installer_MacOs_${version}.${ext}
  icon: build/icon.icns

# ----------------------------------------------------
# CONFIGURATION LINUX
# ----------------------------------------------------
linux:
  target:
    - target: AppImage
    - target: deb
  maintainer: Bienfait Shomari <bienfaitshm@google.com>
  category: Education
  icon: build/icon.png
  description: "Gestionnaire Tchik pour l'éducation"
  desktop:
    entry:
      Name: Tchik
      Comment: Gestionnaire Tchik pour l'éducation
      Categories: Education;Utility;
      Terminal: false
      Type: Application
      StartupWMClass: Tchik
  artifactName: ${productName}_Installer_Linux_${version}.${ext}

# ----------------------------------------------------
# PUBLICATION & REBUILD
# ----------------------------------------------------
npmRebuild: false                        # Évite de recompiler si déjà géré par electron-rebuild en amont

publish:
  provider: github
  owner: bienfaitshm
  repo: TchikDesktop
  releaseType: release
  updaterCacheDirName: tchik-updater