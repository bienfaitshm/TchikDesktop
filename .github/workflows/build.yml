name: Build & Publish Desktop Apps

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  compile:
    name: Build & Publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "yarn"

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron-builder
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install Project Dependencies
        run: yarn install --frozen-lockfile

      - name: Install Linux Build Dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Build and Publish Application
        run: yarn build:all --publish always
        env:
          # Important : on utilise le PAT aussi ici pour que electron-builder
          # puisse uploader sur la release créée par le workflow précédent
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"
