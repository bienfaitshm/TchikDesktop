productName: Tchik
appId: com.bienfaitshm.tchik

directories:
  buildResources: build
  output: release/${version}

files:
  - '!**/.vscode/**'
  - '!src/**'
  - '!electron.vite.config.*'
  - '!.eslint*'
  - '!.prettier*'
  - '!dev-app-update.yml'
  - '!CHANGELOG.md'
  - '!README.md'
  - '!.env*'
  - '!.npmrc'
  - '!pnpm-lock.yaml'
  - '!tsconfig*.json'

extraResources:
  - from: "documents_templates"
    to: "documents_templates"
  - from: "drizzle"
    to: "drizzle"

asarUnpack:
  - node_modules/sqlite3
  - node_modules/better-sqlite3
  - node_modules/@libsql/**/*
  - out/main/chunks/*.node
  - resources/**

# ----------------------------------------------------
# CONFIGURATION WINDOWS
# ----------------------------------------------------
win:
  executableName: Tchik
  icon: build/icon.ico
  publisherName: Bienfait Shomari
  target:
    - target: msi        # Installateur MSI Offline (Déploiement Entreprise/École)
      arch: [x64]
    - target: nsis       # Installateur EXE Offline (Classique)
      arch: [x64, arm64]
    - target: nsis-web   # Installateur EXE Online (Léger)
      arch: [x64, arm64]

# 1. Format MSI (Windows Offline MSI)
msi:
  oneClick: false
  perMachine: true
  runAfterFinish: false
  artifactName: ${productName}_Installer_Windows_${version}.${ext}

# 2. Format NSIS (Windows Offline EXE)
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  displayLanguageSelector: false
  shortcutName: ${productName}
  artifactName: ${productName}_Installer_Windows_${version}-setup.${ext}
  createDesktopShortcut: always
  createStartMenuShortcut: true

# 3. Format NSIS-Web (Windows Online EXE)
nsisWeb:
  artifactName: ${productName}_Online_Setup_Windows_${version}.${ext}
  appPackageUrl: "https://github.com/bienfaitshm/TchikDesktop/releases/download/v${version}"


# ----------------------------------------------------
# CONFIGURATION MAC
# ----------------------------------------------------
mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  notarize: false

dmg:
  artifactName: ${productName}_Installer_MacOs_${version}.${ext}
  icon: build/icon.icns

# ----------------------------------------------------
# CONFIGURATION LINUX
# ----------------------------------------------------
linux:
  target:
    - target: AppImage
    - target: deb
  maintainer: Bienfait Shomari <bienfaitshm@google.com>
  category: Education
  icon: build/
  description: "Gestionnaire Tchik pour l'éducation"
  desktop:
    entry:
      Name: Tchik
      Comment: Gestionnaire Tchik pour l'éducation
      Categories: Education;Utility;
      Terminal: false
      Type: Application
      StartupWMClass: Tchik
    desktopActions:
      NewWindow:
        Name: New Window
        Exec: Tchik --new-window
      NewFile:
        Name: New File
        Exec: Tchik --new-file
  artifactName: ${productName}_Installer_Linux_${version}.${ext}

appImage:
  artifactName: ${productName}_Installer_Linux_${version}.${ext}

# ----------------------------------------------------
# PUBLICATION & REGISTRE
# ----------------------------------------------------
npmRebuild: true

publish:
  provider: github
  owner: bienfaitshm
  repo: TchikDesktop
  releaseType: release
  updaterCacheDirName: tchik-updater