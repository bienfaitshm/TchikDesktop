name: Build & Publish Desktop Apps

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (ex: v1.0.0)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  compile:
    name: Build & Publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Initialize Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "yarn"

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron-builder
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('**/package.json') }}

      - name: Install Project Dependencies
        run: yarn install --frozen-lockfile

      - name: Install Linux Build Dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      # Exécute la compilation et publie tous les formats (EXE, MSI, AppX, DMG, AppImage)
      - name: Build and Publish Application
        run: yarn build:all --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Décommentez et ajoutez ces secrets si vous avez un certificat de signature (Optionnel mais recommandé)
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
