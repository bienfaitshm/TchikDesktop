# ----------------------------------------------------
# GENERAL METADATA & BUILD CONFIGURATION
# ----------------------------------------------------
# Defines application identity and output directories.
productName: Tchik
appId: com.bienfaitshm.tchik

directories:
  buildResources: build
  output: release/${version}

# Specifies files to include/exclude in the final package to optimize size.
files:
  - "out/**/*"
  - "node_modules/**/*"
  - "!**/.vscode/**"
  - "!src/**"
  - "!electron.vite.config.*"
  - "!.eslint*"
  - "!.prettier*"
  - "!dev-app-update.yml"
  - "!CHANGELOG.md"
  - "!README.md"
  - "!.env*"
  - "!.npmrc"
  - "!pnpm-lock.yaml"
  - "!tsconfig*.json"

# Copies additional static resources outside the asar archive.
extraResources:
  - from: "documents_templates"
    to: "documents_templates"
  - from: "drizzle"
    to: "drizzle"

# Excludes native modules from asar compression to ensure they execute correctly.
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/sqlite3/**/*"
  - "**/node_modules/@libsql/**/*"
  - "**/*.node"

# ----------------------------------------------------
# WINDOWS CONFIGURATION
# ----------------------------------------------------
# Defines Windows executable targets (offline and web installers).
win:
  executableName: Tchik
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: nsis-web
      arch: [x64]

# Configures the offline installer behavior.
# perMachine is set to true to allow installation in C:/Program Files without permission errors.
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  displayLanguageSelector: false
  shortcutName: Tchik
  createDesktopShortcut: always
  createStartMenuShortcut: true
  differentialPackage: true

# Configures the web installer.
# appPackageUrl is intentionally omitted to let the GitHub publish provider resolve it automatically.
nsisWeb:
  artifactName: ${productName}_WebInstaller_Windows_${version}.${ext}

# ----------------------------------------------------
# MAC CONFIGURATION
# ----------------------------------------------------
# Defines macOS security entitlements and user permission requests.
mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  target:
    - target: dmg
      arch: [x64, arm64]
  notarize: false

dmg:
  artifactName: ${productName}_Installer_MacOs_${version}.${ext}
  icon: build/icon.icns

# ----------------------------------------------------
# LINUX CONFIGURATION
# ----------------------------------------------------
# Defines Linux distribution targets and desktop environment integrations.
linux:
  target:
    - target: AppImage
    - target: deb
  maintainer: Bienfait Shomari <bienfaitshm@google.com>
  category: Education
  icon: build/icon.png
  description: "Tchik Manager for Education"
  desktop:
    entry:
      Name: Tchik
      Comment: Tchik Manager for Education
      Categories: Education;Utility;
      Terminal: false
      Type: Application
      StartupWMClass: Tchik
  artifactName: ${productName}_Installer_Linux_${version}.${ext}

# ----------------------------------------------------
# PUBLICATION & REBUILD
# ----------------------------------------------------
# Links to the remote repository for auto-updates and release hosting.
npmRebuild: false

publish:
  provider: github
  owner: bienfaitshm
  repo: TchikDesktop
  releaseType: release
  updaterCacheDirName: tchik-updater
